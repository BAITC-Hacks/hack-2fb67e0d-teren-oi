[project]
name = "teren-oi"
version = "0.1.0"
description = "Evidence-grounded comparison of organizational regulations"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
  "openpyxl>=3.1,<4",
  "openai>=1.66,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4,<6",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
