[project]
name = "teren-oi"
version = "0.1.0"
description = "Evidence-grounded comparison of organizational regulations"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
  "python-docx>=1.1,<2",
  "openai>=1.66,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
